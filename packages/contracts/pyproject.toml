[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bpm-contracts"
version = "0.1.0"
description = "Shared API and agent contracts for the intelligent BPM platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "ruff>=0.6",
  "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bpm_contracts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["bpm_contracts"]
mypy_path = "src"
