[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bpm-api"
version = "0.1.0"
description = "FastAPI backend for the intelligent BPM platform"
requires-python = ">=3.12"
dependencies = [
  "bpm-contracts",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.4.0",
  "sqlalchemy[asyncio]>=2.0.32",
  "asyncpg>=0.29.0",
  "psycopg[binary]>=3.2",
  "httpx>=0.27.0",
  "redis>=5.0.0",
  "structlog>=24.4.0",
  "python-json-logger>=2.0.7",
  "PyJWT>=2.9.0",
  "google-genai>=1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-redis",
  "psycopg[binary]>=3.2",
]
temporal = [
  "temporalio>=1.7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]
bpm-contracts = { path = "../../packages/contracts", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP046", "UP047"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []
mypy_path = "."
packages = ["app"]
